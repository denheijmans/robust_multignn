name: robust-mgnn-cpu
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
    - --extra-index-url https://download.pytorch.org/whl/cpu
    - -f https://data.pyg.org/whl/torch-2.4.0+cpu.html
    - torch==2.4.0
    - torch_geometric==2.6.1
    - pyg_lib
    - torch_sparse
    - numpy==2.4.6
    - pandas==3.0.3
    - scipy==1.17.1
    - scikit-learn==1.9.0
    - networkx==3.6.1
    - matplotlib==3.10.9
    - torchmetrics==1.9.0
    - tqdm==4.68.2
    - wandb==0.27.2
    - pytest==9.0.3
